# XcodeGen spec — generates MtLogos.xcodeproj at CI build time so nobody has to
# hand-author (or hand-edit) a project.pbxproj on a machine that doesn't have Xcode.
# The GitHub Actions workflow runs `xcodegen generate` before `xcodebuild`; there is
# no committed .xcodeproj in this repo on purpose — this file is the single source
# of truth for it.
name: MtLogos
options:
  bundleIdPrefix: com.mtlogos
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  MtLogos:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      # .xcassets must be listed under `sources`, not `resources` - under
      # `resources` XcodeGen adds it as a plain folder reference (copied
      # verbatim, never run through Xcode's asset-catalog compiler), which is
      # why the icons silently never made it into the built app at all (no
      # Assets.car in the .ipa, despite the files existing on disk).
      - path: Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        # Declared EXPLICITLY, as build-setting references, because XcodeGen fills in
        # its own defaults for any Info.plist key you don't list — and its default for
        # CFBundleShortVersionString is a literal "1.0". That is why bumping
        # MARKETING_VERSION below alone did nothing: the setting changed, the generated
        # plist still said 1.0, and Apple rejected the upload with 90062/90186 quoting
        # a version this file no longer contained anywhere. Pointing the keys at the
        # settings is what a normal Xcode project does, and it keeps the two in step
        # permanently instead of needing both edited by hand.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Mt. Logos
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # zxing.min.js (QR/barcode scan) and the meal-photo macro feature both use
        # the camera from inside the web app. WKWebView's file-input camera option
        # needs this key on the HOST app or it silently fails, regardless of which
        # in-page feature triggers it.
        NSCameraUsageDescription: "Mt. Logos uses your camera to scan QR codes and take meal or gym photos within the app."
        # Second blocking-unlock condition (2026-10-29) — BlockLocation.swift. Checked
        # on demand only (one fix at a time, right when something tries to unlock), so
        # "When In Use" is enough; no NSLocationAlwaysAndWhenInUseUsageDescription key,
        # since this app never asks for or uses background/continuous tracking.
        NSLocationWhenInUseUsageDescription: "Mt. Logos checks your location, only when you try to unlock blocking settings, against the places your accountability partner approved."
        CFBundleIconName: AppIcon
    # Push Notifications capability — added 2026-09-24 for real APNs push (see
    # Push.swift / WebView.swift's "apnsRegister" handler / the APNs module in
    # worker/src/index.js). XcodeGen generates this entitlements file inline,
    # same "no checked-in file needed" pattern the Info.plist above already
    # uses. `-allowProvisioningUpdates` on the archive step (already relied on
    # for the named "Mt Logos App Store" profile) should also enable the Push
    # Notifications capability on the com.mtlogos.app App ID and regenerate
    # that profile to match automatically, given the App Store Connect API key
    # already in use here — but this is the FIRST entitlement this project has
    # ever declared, so if a build fails on a provisioning/capability error
    # after this lands, enabling Push Notifications by hand once in Apple
    # Developer -> Identifiers -> com.mtlogos.app is the fallback.
    entitlements:
      path: Generated/MtLogos.entitlements
      properties:
        aps-environment: production
        # Content blocking (2026-10-08) — DnsFilter.swift/NEDNSSettingsManager. Needs
        # this entitlement with "dns-settings" in the capability list (confirmed via
        # Apple's own NetworkExtension docs), but — unlike Family Controls above —
        # needs NO separate manual Apple approval; it's available to any paid developer
        # account the moment it's declared. -allowProvisioningUpdates on the archive
        # step should enable the matching App ID capability automatically, same as
        # Push Notifications did; enabling Network Extensions by hand once in Apple
        # Developer -> Identifiers -> com.mtlogos.app is the fallback if a build fails
        # on a provisioning/capability error after this lands.
        com.apple.developer.networking.networkextension:
          - dns-settings
        # App-level blocking (2026-10-11) — AppBlocking.swift/FamilyActivityPicker +
        # ManagedSettingsStore. Separate from and unrelated to the DNS content-blocking
        # above: DNS stays the mechanism for adult-content website blocking (list never
        # leaves the server, nobody has to look at it to turn it on/off). This is only
        # for blocking specific APPS (App Store, and later any app the user picks) —
        # Apple requires a human to select apps from its own on-screen picker for this,
        # which is fine here since app names aren't sensitive the way a website list is.
        # Family Controls needed Apple's manual entitlement approval (granted 2026-10-08,
        # confirmed in Apple Developer -> Certificates/Identifiers -> com.mtlogos.app)
        # before it could ever be declared here — this is the first build to actually use
        # it. -allowProvisioningUpdates on the archive step should pick up the matching
        # App ID capability automatically, same as Push Notifications/DNS did; enabling
        # Family Controls by hand once in Apple Developer -> Identifiers -> com.mtlogos.app
        # is the fallback if a build fails on a provisioning/capability error after this.
        com.apple.developer.family-controls: true
        # Portal setup completed 2026-10-11: App Group registered, Family Controls
        # (Development/Distribution/App and Website Usage) + App Groups enabled on both
        # this App ID and com.mtlogos.app.monitor, both linked to group.com.mtlogos.app,
        # stale "Mt Logos App Store" profile deleted so a fresh one regenerates clean.
        # App Group (2026-10-11) — lets the main app and the new MonitorExtension below
        # (a separate mini-binary Apple's system runs on its own schedule, not something
        # this app's own process controls) read/write the SAME stored app-blocking rules
        # (AppBlockingRules.swift). Plain UserDefaults is sandboxed per-target; an App
        # Group is the standard, Apple-documented way two targets from the same app share
        # state. No manual Apple approval needed for this one, just declaring it and
        # using the matching group id in both targets' entitlements.
        com.apple.security.application-groups:
          - group.com.mtlogos.app
        # Universal Links (2026-10-20) — real bug reported live: an accountability
        # partner's share link/referral link tapped on a phone with this app already
        # installed still opened mtlogos.com in Safari instead of this app. Root cause
        # was two separate gaps, both closed together: the Worker's
        # /.well-known/apple-app-site-association route (worker/src/index.js) builds its
        # `applinks.details[].appIDs` from the IOS_APP_ID var in wrangler.toml, which was
        # empty — set to "QKPAT27SX9.com.mtlogos.app" (this project's own DEVELOPMENT_TEAM
        # + bundle id, see below) in the same pass as this entitlement — but AASA alone
        # does nothing without the app ITSELF declaring it wants to handle mtlogos.com
        # links, which is this entitlement, never declared before now. See
        # ContentView.onOpenURL (WebView.swift) for the half that actually routes an
        # incoming link to the right in-app page once iOS hands it over.
        com.apple.developer.associated-domains:
          - applinks:mtlogos.com
          - applinks:www.mtlogos.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtlogos.app
        PRODUCT_NAME: "Mt. Logos"
        # Bumped from "1.0" 2026-09-17. Once a version is APPROVED on the App Store,
        # Apple closes that "pre-release train" — every further upload under the same
        # MARKETING_VERSION is rejected outright (error 90062 "must contain a higher
        # version than that of the previously approved version", plus 90186 "train
        # version '1.0' is closed for new build submissions"), no matter what the
        # build number is. So this has to move for any new release, not just the
        # build number below.
        # Bumped from "1.0.1" 2026-09-23 — that version reached "Ready for Distribution"
        # (approved), closing its train the same way 1.0 did. See the comment above.
        # Jumped from "1.0.3" to "4.0.0" then "4.0.2" 2026-10-07 — cosmetic only, per
        # Kanyon: wants the public version number to reflect the real amount of
        # development behind the app (the iOS wrapper is ~1 month old, but the web app
        # it wraps has had far more revisions than that number alone would suggest).
        # Not tied to a real feature-maturity milestone; Apple has no rule against the
        # jump, it only requires each new submission be strictly higher than the last
        # approved one (see the comment above this block), which 4.0.2 clears easily
        # and leaves plenty of real headroom (4.1, 4.2, 5.0...) for years of
        # legitimate future releases without ever forcing an awkward number.
        # 4.0.3 (10), 2026-10-08: fresh release so the listing shows a recent update
        # (Kanyon). No native changes; today's work was all on mtlogos.com.
        # 4.1.0 (11), 2026-10-08: first REAL native change since Push Notifications —
        # content blocking (DnsFilter.swift/NEDNSSettingsManager). Minor version bump,
        # not cosmetic, since this is an actual new capability, not a re-upload.
        # 4.2.0 (12), 2026-10-11: second real batch of native changes — app blocking
        # (AppBlocking.swift/FamilyActivityPicker), conditional per-app rules
        # (MonitorExtension, a second target — see its own comment above), DNS
        # disable error-message fix. This number had sat at 4.1.0 (11) since 10-08
        # with none of today's changes reflected in it, which was ALSO why every
        # CI build today failed at Upload to TestFlight even before the provisioning
        # errors: Apple rejects re-uploading an already-used (version, build) pair,
        # and (4.1.0, 11) was already live from 10-08.
        # Apple rejects re-uploading the same (version, build) pair. Bump this every
        # time a new build is pushed to main; reset to "1" alongside a new
        # MARKETING_VERSION if you prefer, but never reuse a pair.
        # 13, 2026-10-11: runs #46 and #47 both uploaded as build 12 — this number
        # was never bumped between those two pushes, only Swift source changed. The
        # "Upload to TestFlight" step succeeding in CI only means altool's transfer
        # succeeded; Apple's own post-upload processing can still silently reject a
        # duplicate (version, build) pair afterward, so one or both of 46/47 may not
        # actually show up usable in TestFlight. This build (13) is the first clean,
        # unambiguous one since the App Store toggle/clock-tamper code landed.
        # 4.2.1 (22), 2026-10-20: Universal Links fix (see the associated-domains
        # entitlement comment above) — a real native capability change, not cosmetic.
        # 4.3.1 (23), 2026-10-21: Apple In-App Purchase (IAPManager.swift + the "iap"
        # WKScriptMessageHandler bridge in WebView.swift) — the fix for Apple's 3.1.1
        # rejection on submission d8a76719 ("Version reviewed: 4.3.0 (21)": that pair
        # was never produced by a commit in THIS repo's own history — the last one
        # pushed before this was 4.2.1 (22) — so it must have come from a submission
        # made outside this pipeline; picking 4.3.1/23, higher than BOTH numbers in
        # that mismatched pair and the last real commit here, sidesteps Apple's
        # strict-increase rule regardless of which train is actually live on their
        # side). No new entitlement needed — unlike Push/Associated Domains/Family
        # Controls, in-app purchase capability doesn't require one; StoreKit works
        # off the Product IDs created directly in App Store Connect.
        # 4.3.2 (24), 2026-10-22: real live bug report the same day 4.3.1 shipped —
        # "the buttons keep freezing and i have to close the app and reopen", all
        # buttons, no clear trigger. Root cause: the "iap" bridge's three Task{}
        # closures in WebView.swift ran evaluateJavaScript() off the main actor —
        # see that file's own comment on the fix for the full mechanism. Since this
        # whole app is ONE shared WKWebView (every tab, not just /pay), a single bad
        # off-main hop there could plausibly wedge the webview for the entire app,
        # not just the purchase screen. NOT DEVICE-VERIFIED as the confirmed cause.
        # 4.4.0 (25), 2026-10-29: second unlock condition — location — added on top of
        # the existing partner approval, per Kanyon ("I want to add two conditions to
        # unlock. Including location"), covering both the DNS adult-content filter and
        # App Blocking (they already shared one approval gate). New CoreLocation
        # bridge ("blockLocation", BlockLocation.swift), new NSLocationWhenInUseUsage-
        # Description key above — "When In Use" only, checked on demand, never
        # continuous background tracking.
        # 4.4.1 (26), 2026-10-30: deletion blocking. Kanyon, right after 4.4.0 shipped:
        # "have you also added the toggle that makes it so the user cannot delete the
        # mt logos app to bypass the blockers?" It hadn't been — new ManagedSettings
        # Application.denyAppRemoval toggle in AppBlocking.swift, off by default,
        # device-wide (no per-app API from Apple), gated the same asymmetric way as
        # everything else: free to turn on, needs partner approval + location to turn
        # off. No new entitlement, no new Info.plist key.
        # 4.5.0 (27), 2026-10-30: blocking/app blocking rebuild in one batch — deletion
        # block moved from App Blocking into the Blocking card; tighten-any-time/
        # loosen-needs-partner now enforced natively for the picker (removing a blocked
        # app) and per-app rules (AppBlockingRules.swift's appBlockRuleIsTighterOrEqual,
        # AppRuleEditorView.swift's commit()); pickApps/editRules take a canEdit flag
        # from the web page instead of being fully gated; accountability-partner
        # acceptance step (partner-accept page) before they're live as an approver;
        # unlock-condition AND/OR setting; change-log email to the partner in place of
        # screen recording (not something any regular App Store app can do). No new
        # entitlement, no new Info.plist key.
        # 4.5.0 (29), 2026-11-16: three real gaps closed in one batch, same 4.5.0 train
        # (28 is still the one actually in front of Apple review as of this commit —
        # bump to 29 only once ready to actually supersede it in the queue). (1) New
        # ShieldConfig extension target — a real on-screen shield (black background,
        # Mt. Logos logo) for a blocked app/category/web domain; previously iOS's own
        # unbranded default shield was all anyone ever saw, regardless of anything
        # AppBlocking.swift already enforced. (2) AppBlocking.ensureAuthorized() is no
        # longer private and gets its own "connectScreenTime"/"screenTimeStatus" bridge
        # cases (WebView.swift) — real report: someone who'd only ever used DNS content
        # blocking (a wholly separate mechanism) had never been through the Family
        # Controls prompt at all, since it previously only fired as a side effect of
        # opening the app-picker, and Mt. Logos never showed up in iOS's own Settings ->
        # Screen Time -> "Apps With Screen Time Access" list as a result. (3) New
        # "openSystemSettings" bridge case (UIApplication.openSettingsURLString) — one
        # tap closer to iOS's own Settings app; there's no public, App-Review-safe deep
        # link straight to the Screen Time screen itself. (4) rule_loosened/apps_removed
        # change-log entries now carry the real before/after numbers (describeRuleLoosening()
        # in AppBlockingRules.swift) instead of always being empty strings — the app's
        # NAME still can never be included, Apple-opaque ApplicationToken, no new
        # entitlement needed for any of this batch beyond ShieldConfig's own
        # family-controls declaration above, which it needs for the same reason
        # MonitorExtension already does.
        # 4.5.0 (30), 2026-11-17: ShieldConfig pulled from this build (see the
        # dependencies comment above) so the DnsFilter.swift token fix, the
        # Push.swift badge-clear fix, and today's Connect Screen Time race fix
        # (WebView.swift/mtλapp.html) can actually ship while Apple's Family
        # Controls Distribution approval for com.mtlogos.app.shieldconfig is
        # pending. No Swift change in this bump beyond what 29 already had;
        # pulling a target changes what's in the .ipa, so this can't reuse 29's
        # already-attempted (version, build) pair even though that attempt
        # never got far enough to actually upload.
        # 4.5.1 (31), 2026-11-17: real upload error, not a provisioning one —
        # altool 90186/90062: "4.5.0 is closed for new build submissions,"
        # "must contain a higher version than the previously approved version
        # [4.5.0]." Build 28 (see the 4.5.0 (29) comment above, "28 is still
        # the one actually in front of Apple review") got APPROVED on Apple's
        # side at some point since, closing that whole train — bumping only
        # CURRENT_PROJECT_VERSION (29->30) was never going to clear this, since
        # the block is on MARKETING_VERSION itself, not the build number. Every
        # Swift/web fix from builds 29/30 (none of which ever got far enough to
        # upload) rides along in this one. Submitted to Apple review same day —
        # left untouched here; this version bump is separate, below.
        # 4.5.2 (32), 2026-11-17: ShieldConfig re-added (see dependencies
        # comment above) now that Apple's approved the Family Controls
        # Distribution entitlement. Can't reuse 4.5.1 (31)'s pair — that one is
        # already uploaded and sitting in Apple review with a DIFFERENT binary
        # (no Shield extension); this is a genuinely different .ipa.
        # Build 33, 2026-11-18: same 4.5.2 binary intent as build 32, but with two
        # real fixes that landed AFTER 32 already uploaded (the Screen Time connect
        # double-tap race, and the iPhone-version-in-Settings feature) -- can't reuse
        # 32's pair, that exact number is already sitting on Apple's servers from a
        # successful upload (see 4.5.2 (32)'s own comment above).
        # Build 34, 2026-11-22: real fix for "Block adult content" refusing to turn
        # on with a live "configuration is unchanged" system error -- shipping
        # immediately rather than batched, since it's something already reported
        # broken on a real device, not a routine Swift change.
        # Marketing version bumped to 4.5.3 in the same commit: the altool upload
        # itself failed with a real Apple error -- 4.5.2 was already an APPROVED
        # version on the App Store, and Apple refuses any new build whose
        # CFBundleShortVersionString isn't strictly higher than the last approved
        # one, regardless of build number. Not a batching call, a hard requirement.
        # Build 35, 2026-11-23: batching two more real-reported fixes (the
        # partner-accept email link opening plain home instead of the right
        # page, and deletion-block/App-Store-block reporting "Protected" after
        # the underlying authorization had already been revoked) -- 34 itself
        # is currently "Waiting for Review" on App Store Connect; this upload
        # does not touch that submission, it just makes 35 available as a
        # build Kanyon can swap in if he wants these fixes in the reviewed
        # version instead of waiting for 34 to clear first.
        # 36 (2026-11-23): real report, "the toggle won't stay on and keeps
        # giving red error" on Change time settings -- ClockIntegrityGuard's
        # Dismiss only cleared the tampered flag, never its own stale wall/
        # uptime baseline, so the next check re-flagged immediately.
        # 37 (2026-11-23): 4.5.3/34 was approved and is live -- Kanyon created
        # a real 4.5.4 version on App Store Connect for the next release, and
        # Apple only lets a build attach to a version when the two match
        # exactly, so 36's fix is rebuilt here under 4.5.4 so it can actually
        # be picked for it.
        # 38 (2026-11-24): add-app order (new apps are Not blocked yet until Save), per-place distances.
        # 39 (2026-11-24): same code as 38, rebuilt as 4.5.5 because Kanyon created a 4.5.5 version on
        # App Store Connect and a build only attaches to the version it was built as.
        MARKETING_VERSION: "4.5.5"
        CURRENT_PROJECT_VERSION: "39"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        DEVELOPMENT_TEAM: QKPAT27SX9          # Mt. Logos, LLC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: false
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        # Manual signing, stated explicitly, instead of CODE_SIGN_STYLE=Automatic.
        # Automatic signing's Development-vs-Distribution inference proved
        # unreliable for `xcodebuild archive` in this project (repeatedly asked
        # for a Development profile requiring registered test devices, even for
        # an archive build, and errors if CODE_SIGN_IDENTITY is set alongside
        # it). Manual + an explicit Distribution identity removes that guesswork
        # entirely — `-allowProvisioningUpdates` on the xcodebuild command still
        # auto-creates/downloads the matching profile via the API key, it just no
        # longer has to GUESS which kind to make.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        # Manual style needs a profile NAME to act on. This one doesn't exist yet -
        # -allowProvisioningUpdates on the archive command creates it on first run
        # (App Store distribution profile for com.mtlogos.app) and reuses it after.
        PROVISIONING_PROFILE_SPECIFIER: "Mt Logos App Store"
    dependencies:
      - target: MonitorExtension
        embed: true
      # ShieldConfig re-added (2026-11-17) — Apple approved the Family Controls
      # (Distribution) entitlement request (submitted earlier today, Request ID
      # 838MQBB8HZ) within minutes, far faster than the weeks-to-months other
      # developers reported. Was pulled from the build for a few hours (see git
      # history on this line) purely because "Export .ipa" failed without this
      # entitlement — same black-screen-with-logo shield code, untouched the
      # whole time. If the provisioning profile ("Mt Logos Shield Extension")
      # was created BEFORE this approval landed, -allowProvisioningUpdates may
      # not pick up the newly-available capability automatically; the fallback,
      # same as the original setup, is regenerating that profile by hand once in
      # Apple Developer Portal.
      - target: ShieldConfig
        embed: true

  # Conditional app-blocking rules (2026-10-11) — Kanyon wants, per app: a default of
  # fully blocked, then progressively deeper opt-in tiers (unlock windows -> daily/
  # weekly time budget -> minimum time between opens -> max session length). Apple's
  # DeviceActivityMonitor is the ONLY mechanism that can enforce a schedule or a time
  # budget without the main app running — it's a separate, small binary (an app
  # extension) that Apple's system itself launches on a schedule or when a tracked
  # threshold is crossed, completely independent of whether MtLogos.app is open. See
  # Sources/Extension/MonitorExtension.swift for the actual enforcement logic and
  # Sources/AppBlockingRules.swift for the rule model both targets share via the App
  # Group above.
  MonitorExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Extension
      # The rule model is shared, not duplicated — same file compiled into both targets.
      - path: Sources/AppBlockingRules.swift
      # This extension is its OWN separate bundle, and uses the same UserDefaults/
      # systemUptime APIs via the shared AppBlockingRules.swift above (ClockIntegrityGuard
      # runs inside MonitorExtension.swift too) — Apple requires each bundle that
      # accesses a required-reason API to carry its own privacy manifest, not just the
      # main app's. Same file, included in both targets' sources on purpose.
      - path: Sources/PrivacyInfo.xcprivacy
    info:
      path: Generated/MonitorExtension-Info.plist
      properties:
        CFBundleDisplayName: MtLogos Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    entitlements:
      path: Generated/MonitorExtension.entitlements
      properties:
        # An extension enforcing Family Controls restrictions needs this entitlement
        # too, same as the main app — confirmed via Apple's DeviceActivityMonitor docs.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mtlogos.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtlogos.app.monitor
        PRODUCT_NAME: "MtLogos Monitor"
        # Must match the main MtLogos target's version exactly — Apple validates an
        # embedded extension's version against its host app at upload time. This
        # had drifted to 4.5.0 (30) while the main target moved through 4.5.1
        # (31) — caught 2026-11-17 while re-adding ShieldConfig, before it could
        # cause its own upload failure.
        # Build 33, 2026-11-18: same 4.5.2 binary intent as build 32, but with two
        # real fixes that landed AFTER 32 already uploaded (the Screen Time connect
        # double-tap race, and the iPhone-version-in-Settings feature) -- can't reuse
        # 32's pair, that exact number is already sitting on Apple's servers from a
        # successful upload (see 4.5.2 (32)'s own comment above).
        # Build 34, 2026-11-22: real fix for "Block adult content" refusing to turn
        # on with a live "configuration is unchanged" system error -- shipping
        # immediately rather than batched, since it's something already reported
        # broken on a real device, not a routine Swift change.
        # Marketing version bumped to 4.5.3 in the same commit: the altool upload
        # itself failed with a real Apple error -- 4.5.2 was already an APPROVED
        # version on the App Store, and Apple refuses any new build whose
        # CFBundleShortVersionString isn't strictly higher than the last approved
        # one, regardless of build number. Not a batching call, a hard requirement.
        # Build 35, 2026-11-23: batching two more real-reported fixes (the
        # partner-accept email link opening plain home instead of the right
        # page, and deletion-block/App-Store-block reporting "Protected" after
        # the underlying authorization had already been revoked) -- 34 itself
        # is currently "Waiting for Review" on App Store Connect; this upload
        # does not touch that submission, it just makes 35 available as a
        # build Kanyon can swap in if he wants these fixes in the reviewed
        # version instead of waiting for 34 to clear first.
        # 36 (2026-11-23): real report, "the toggle won't stay on and keeps
        # giving red error" on Change time settings -- ClockIntegrityGuard's
        # Dismiss only cleared the tampered flag, never its own stale wall/
        # uptime baseline, so the next check re-flagged immediately.
        # 37 (2026-11-23): 4.5.3/34 was approved and is live -- Kanyon created
        # a real 4.5.4 version on App Store Connect for the next release, and
        # Apple only lets a build attach to a version when the two match
        # exactly, so 36's fix is rebuilt here under 4.5.4 so it can actually
        # be picked for it.
        # 38 (2026-11-24): add-app order (new apps are Not blocked yet until Save), per-place distances.
        # 39 (2026-11-24): same code as 38, rebuilt as 4.5.5 because Kanyon created a 4.5.5 version on
        # App Store Connect and a build only attaches to the version it was built as.
        MARKETING_VERSION: "4.5.5"
        CURRENT_PROJECT_VERSION: "39"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: QKPAT27SX9
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        # Separate profile from the main app's, named distinctly so -allowProvisioningUpdates
        # creates/reuses the right one for this extension's own bundle id automatically,
        # same pattern as the main app's own profile.
        PROVISIONING_PROFILE_SPECIFIER: "Mt Logos Monitor Extension"

  # Shield Configuration Extension (2026-11-16) — draws the actual on-screen shield
  # (black background + Mt. Logos logo, see Sources/ShieldConfig/ShieldConfigurationExtension.swift)
  # whenever a blocked app/category/web domain is opened. A UI-less "service" extension —
  # Apple's ManagedSettingsUI framework calls it and renders the ShieldConfiguration it
  # returns; this target has no app of its own to run.
  ShieldConfig:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/ShieldConfig
      - path: Resources/ShieldAssets.xcassets
    info:
      path: Generated/ShieldConfig-Info.plist
      properties:
        CFBundleDisplayName: MtLogos Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Generated/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtlogos.app.shieldconfig
        PRODUCT_NAME: "MtLogos Shield"
        # Must match the main MtLogos target's version exactly, same rule as MonitorExtension.
        # Had drifted to 4.5.0 (29) from when this target was first added, never
        # bumped while it sat unembedded — caught 2026-11-17 re-adding it.
        # Build 33, 2026-11-18: same 4.5.2 binary intent as build 32, but with two
        # real fixes that landed AFTER 32 already uploaded (the Screen Time connect
        # double-tap race, and the iPhone-version-in-Settings feature) -- can't reuse
        # 32's pair, that exact number is already sitting on Apple's servers from a
        # successful upload (see 4.5.2 (32)'s own comment above).
        # Build 34, 2026-11-22: real fix for "Block adult content" refusing to turn
        # on with a live "configuration is unchanged" system error -- shipping
        # immediately rather than batched, since it's something already reported
        # broken on a real device, not a routine Swift change.
        # Marketing version bumped to 4.5.3 in the same commit: the altool upload
        # itself failed with a real Apple error -- 4.5.2 was already an APPROVED
        # version on the App Store, and Apple refuses any new build whose
        # CFBundleShortVersionString isn't strictly higher than the last approved
        # one, regardless of build number. Not a batching call, a hard requirement.
        # Build 35, 2026-11-23: batching two more real-reported fixes (the
        # partner-accept email link opening plain home instead of the right
        # page, and deletion-block/App-Store-block reporting "Protected" after
        # the underlying authorization had already been revoked) -- 34 itself
        # is currently "Waiting for Review" on App Store Connect; this upload
        # does not touch that submission, it just makes 35 available as a
        # build Kanyon can swap in if he wants these fixes in the reviewed
        # version instead of waiting for 34 to clear first.
        # 36 (2026-11-23): real report, "the toggle won't stay on and keeps
        # giving red error" on Change time settings -- ClockIntegrityGuard's
        # Dismiss only cleared the tampered flag, never its own stale wall/
        # uptime baseline, so the next check re-flagged immediately.
        # 37 (2026-11-23): 4.5.3/34 was approved and is live -- Kanyon created
        # a real 4.5.4 version on App Store Connect for the next release, and
        # Apple only lets a build attach to a version when the two match
        # exactly, so 36's fix is rebuilt here under 4.5.4 so it can actually
        # be picked for it.
        # 38 (2026-11-24): add-app order (new apps are Not blocked yet until Save), per-place distances.
        # 39 (2026-11-24): same code as 38, rebuilt as 4.5.5 because Kanyon created a 4.5.5 version on
        # App Store Connect and a build only attaches to the version it was built as.
        MARKETING_VERSION: "4.5.5"
        CURRENT_PROJECT_VERSION: "39"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: QKPAT27SX9
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        # Own distinct profile name, same -allowProvisioningUpdates auto-create/reuse
        # pattern as the main app's and MonitorExtension's.
        PROVISIONING_PROFILE_SPECIFIER: "Mt Logos Shield Extension"
