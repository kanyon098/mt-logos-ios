# XcodeGen spec — generates MtLogos.xcodeproj at CI build time so nobody has to
# hand-author (or hand-edit) a project.pbxproj on a machine that doesn't have Xcode.
# The GitHub Actions workflow runs `xcodegen generate` before `xcodebuild`; there is
# no committed .xcodeproj in this repo on purpose — this file is the single source
# of truth for it.
name: MtLogos
options:
  bundleIdPrefix: com.mtlogos
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  MtLogos:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      # .xcassets must be listed under `sources`, not `resources` - under
      # `resources` XcodeGen adds it as a plain folder reference (copied
      # verbatim, never run through Xcode's asset-catalog compiler), which is
      # why the icons silently never made it into the built app at all (no
      # Assets.car in the .ipa, despite the files existing on disk).
      - path: Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        # Declared EXPLICITLY, as build-setting references, because XcodeGen fills in
        # its own defaults for any Info.plist key you don't list — and its default for
        # CFBundleShortVersionString is a literal "1.0". That is why bumping
        # MARKETING_VERSION below alone did nothing: the setting changed, the generated
        # plist still said 1.0, and Apple rejected the upload with 90062/90186 quoting
        # a version this file no longer contained anywhere. Pointing the keys at the
        # settings is what a normal Xcode project does, and it keeps the two in step
        # permanently instead of needing both edited by hand.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Mt. Logos
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # zxing.min.js (QR/barcode scan) and the meal-photo macro feature both use
        # the camera from inside the web app. WKWebView's file-input camera option
        # needs this key on the HOST app or it silently fails, regardless of which
        # in-page feature triggers it.
        NSCameraUsageDescription: "Mt. Logos uses your camera to scan QR codes and take meal or gym photos within the app."
        CFBundleIconName: AppIcon
    # Push Notifications capability — added 2026-09-24 for real APNs push (see
    # Push.swift / WebView.swift's "apnsRegister" handler / the APNs module in
    # worker/src/index.js). XcodeGen generates this entitlements file inline,
    # same "no checked-in file needed" pattern the Info.plist above already
    # uses. `-allowProvisioningUpdates` on the archive step (already relied on
    # for the named "Mt Logos App Store" profile) should also enable the Push
    # Notifications capability on the com.mtlogos.app App ID and regenerate
    # that profile to match automatically, given the App Store Connect API key
    # already in use here — but this is the FIRST entitlement this project has
    # ever declared, so if a build fails on a provisioning/capability error
    # after this lands, enabling Push Notifications by hand once in Apple
    # Developer -> Identifiers -> com.mtlogos.app is the fallback.
    entitlements:
      path: Generated/MtLogos.entitlements
      properties:
        aps-environment: production
        # Content blocking (2026-10-08) — DnsFilter.swift/NEDNSSettingsManager. Needs
        # this entitlement with "dns-settings" in the capability list (confirmed via
        # Apple's own NetworkExtension docs), but — unlike Family Controls above —
        # needs NO separate manual Apple approval; it's available to any paid developer
        # account the moment it's declared. -allowProvisioningUpdates on the archive
        # step should enable the matching App ID capability automatically, same as
        # Push Notifications did; enabling Network Extensions by hand once in Apple
        # Developer -> Identifiers -> com.mtlogos.app is the fallback if a build fails
        # on a provisioning/capability error after this lands.
        com.apple.developer.networking.networkextension:
          - dns-settings
        # App-level blocking (2026-10-11) — AppBlocking.swift/FamilyActivityPicker +
        # ManagedSettingsStore. Separate from and unrelated to the DNS content-blocking
        # above: DNS stays the mechanism for adult-content website blocking (list never
        # leaves the server, nobody has to look at it to turn it on/off). This is only
        # for blocking specific APPS (App Store, and later any app the user picks) —
        # Apple requires a human to select apps from its own on-screen picker for this,
        # which is fine here since app names aren't sensitive the way a website list is.
        # Family Controls needed Apple's manual entitlement approval (granted 2026-10-08,
        # confirmed in Apple Developer -> Certificates/Identifiers -> com.mtlogos.app)
        # before it could ever be declared here — this is the first build to actually use
        # it. -allowProvisioningUpdates on the archive step should pick up the matching
        # App ID capability automatically, same as Push Notifications/DNS did; enabling
        # Family Controls by hand once in Apple Developer -> Identifiers -> com.mtlogos.app
        # is the fallback if a build fails on a provisioning/capability error after this.
        com.apple.developer.family-controls: true
        # Portal setup completed 2026-10-11: App Group registered, Family Controls
        # (Development/Distribution/App and Website Usage) + App Groups enabled on both
        # this App ID and com.mtlogos.app.monitor, both linked to group.com.mtlogos.app,
        # stale "Mt Logos App Store" profile deleted so a fresh one regenerates clean.
        # App Group (2026-10-11) — lets the main app and the new MonitorExtension below
        # (a separate mini-binary Apple's system runs on its own schedule, not something
        # this app's own process controls) read/write the SAME stored app-blocking rules
        # (AppBlockingRules.swift). Plain UserDefaults is sandboxed per-target; an App
        # Group is the standard, Apple-documented way two targets from the same app share
        # state. No manual Apple approval needed for this one, just declaring it and
        # using the matching group id in both targets' entitlements.
        com.apple.security.application-groups:
          - group.com.mtlogos.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtlogos.app
        PRODUCT_NAME: "Mt. Logos"
        # Bumped from "1.0" 2026-09-17. Once a version is APPROVED on the App Store,
        # Apple closes that "pre-release train" — every further upload under the same
        # MARKETING_VERSION is rejected outright (error 90062 "must contain a higher
        # version than that of the previously approved version", plus 90186 "train
        # version '1.0' is closed for new build submissions"), no matter what the
        # build number is. So this has to move for any new release, not just the
        # build number below.
        # Bumped from "1.0.1" 2026-09-23 — that version reached "Ready for Distribution"
        # (approved), closing its train the same way 1.0 did. See the comment above.
        # Jumped from "1.0.3" to "4.0.0" then "4.0.2" 2026-10-07 — cosmetic only, per
        # Kanyon: wants the public version number to reflect the real amount of
        # development behind the app (the iOS wrapper is ~1 month old, but the web app
        # it wraps has had far more revisions than that number alone would suggest).
        # Not tied to a real feature-maturity milestone; Apple has no rule against the
        # jump, it only requires each new submission be strictly higher than the last
        # approved one (see the comment above this block), which 4.0.2 clears easily
        # and leaves plenty of real headroom (4.1, 4.2, 5.0...) for years of
        # legitimate future releases without ever forcing an awkward number.
        # 4.0.3 (10), 2026-10-08: fresh release so the listing shows a recent update
        # (Kanyon). No native changes; today's work was all on mtlogos.com.
        # 4.1.0 (11), 2026-10-08: first REAL native change since Push Notifications —
        # content blocking (DnsFilter.swift/NEDNSSettingsManager). Minor version bump,
        # not cosmetic, since this is an actual new capability, not a re-upload.
        # 4.2.0 (12), 2026-10-11: second real batch of native changes — app blocking
        # (AppBlocking.swift/FamilyActivityPicker), conditional per-app rules
        # (MonitorExtension, a second target — see its own comment above), DNS
        # disable error-message fix. This number had sat at 4.1.0 (11) since 10-08
        # with none of today's changes reflected in it, which was ALSO why every
        # CI build today failed at Upload to TestFlight even before the provisioning
        # errors: Apple rejects re-uploading an already-used (version, build) pair,
        # and (4.1.0, 11) was already live from 10-08.
        MARKETING_VERSION: "4.2.0"
        # Apple rejects re-uploading the same (version, build) pair. Bump this every
        # time a new build is pushed to main; reset to "1" alongside a new
        # MARKETING_VERSION if you prefer, but never reuse a pair.
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        DEVELOPMENT_TEAM: QKPAT27SX9          # Mt. Logos, LLC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: false
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        # Manual signing, stated explicitly, instead of CODE_SIGN_STYLE=Automatic.
        # Automatic signing's Development-vs-Distribution inference proved
        # unreliable for `xcodebuild archive` in this project (repeatedly asked
        # for a Development profile requiring registered test devices, even for
        # an archive build, and errors if CODE_SIGN_IDENTITY is set alongside
        # it). Manual + an explicit Distribution identity removes that guesswork
        # entirely — `-allowProvisioningUpdates` on the xcodebuild command still
        # auto-creates/downloads the matching profile via the API key, it just no
        # longer has to GUESS which kind to make.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        # Manual style needs a profile NAME to act on. This one doesn't exist yet -
        # -allowProvisioningUpdates on the archive command creates it on first run
        # (App Store distribution profile for com.mtlogos.app) and reuses it after.
        PROVISIONING_PROFILE_SPECIFIER: "Mt Logos App Store"
    dependencies:
      - target: MonitorExtension
        embed: true

  # Conditional app-blocking rules (2026-10-11) — Kanyon wants, per app: a default of
  # fully blocked, then progressively deeper opt-in tiers (unlock windows -> daily/
  # weekly time budget -> minimum time between opens -> max session length). Apple's
  # DeviceActivityMonitor is the ONLY mechanism that can enforce a schedule or a time
  # budget without the main app running — it's a separate, small binary (an app
  # extension) that Apple's system itself launches on a schedule or when a tracked
  # threshold is crossed, completely independent of whether MtLogos.app is open. See
  # Sources/Extension/MonitorExtension.swift for the actual enforcement logic and
  # Sources/AppBlockingRules.swift for the rule model both targets share via the App
  # Group above.
  MonitorExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Extension
      # The rule model is shared, not duplicated — same file compiled into both targets.
      - path: Sources/AppBlockingRules.swift
    info:
      path: Generated/MonitorExtension-Info.plist
      properties:
        CFBundleDisplayName: MtLogos Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    entitlements:
      path: Generated/MonitorExtension.entitlements
      properties:
        # An extension enforcing Family Controls restrictions needs this entitlement
        # too, same as the main app — confirmed via Apple's DeviceActivityMonitor docs.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mtlogos.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtlogos.app.monitor
        PRODUCT_NAME: "MtLogos Monitor"
        # Must match the main MtLogos target's version exactly — Apple validates an
        # embedded extension's version against its host app at upload time.
        MARKETING_VERSION: "4.2.0"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: QKPAT27SX9
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        # Separate profile from the main app's, named distinctly so -allowProvisioningUpdates
        # creates/reuses the right one for this extension's own bundle id automatically,
        # same pattern as the main app's own profile.
        PROVISIONING_PROFILE_SPECIFIER: "Mt Logos Monitor Extension"
